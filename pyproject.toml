[tool.ruff]
target-version = "py311"
fix = true
output-format = "full"
lint.select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "PT",  # flake8-pytest-style
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
  "YTT", # flake8-2020
]
lint.ignore = [
  "E501", # Line too long
]
